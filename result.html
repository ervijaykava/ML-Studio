<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Studio</title><link rel="stylesheet" href="style.css"></head>
<body data-page="result">
<div id="top"></div>
<main>
  <div id="steps"></div>
  <h1>Model Results</h1>
  <p class="sub" id="none"></p>
  <div id="out" class="hide">
    <div class="grid g4" id="metrics" style="margin-bottom:20px"></div>
    <div class="grid g2 res" id="imgs"></div>
    <div class="grid g2">
      <div class="card"><h2>Summary</h2><div class="sum" id="sum" style="margin-top:12px"></div></div>
      <div class="card"><h2>Model Status</h2><p class="ok">✓ Model trained successfully</p><p class="ok">✓ Testing completed</p><p class="ok">✓ Results generated</p></div>
    </div>
    <a class="btn" href="upload.html">Train Another Model</a>
  </div>
</main>
<script src="script.js"></script></body></html>
