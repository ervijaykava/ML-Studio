<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Studio</title><link rel="stylesheet" href="style.css"></head>
<body data-page="train">
<div id="top"></div>
<main>
  <div id="steps"></div>
